<div *ngIf="prediction$ | async as prediction">

  <h2 class="text-xl font-bold mb-4">
    Aftershock Prediction
  </h2>

  <div class="space-y-2">

    <p class="text-lg">
      Risk Level:
      <span
        class="font-semibold"
        [ngClass]="{
          'text-green-600': prediction.risk === 'Low',
          'text-yellow-600': prediction.risk === 'Moderate',
          'text-red-600': prediction.risk === 'High'
        }"
      >
        {{ prediction.risk }}
      </span>
    </p>

    <p class="text-lg">
      Estimated Probability:
      <span class="font-semibold">
        {{ prediction.probability }}%
      </span>
    </p>

  </div>

</div>
