<div *ngIf="prediction$ | async as prediction">

  <h2 class="text-xl mb-4">
    Predicción de réplica
  </h2>
  <hr class="border-t border-gray-600 my-4">

  <div class="space-y-2">

    <p class="text-lg">
      Nivel de riesgo:
      <span
        class="font-semibold"
        [ngClass]="{
          'text-green-600': prediction.risk === 'Bajo',
          'text-yellow-600': prediction.risk === 'Moderado',
          'text-red-600': prediction.risk === 'Alto'
        }"
      >
        {{ prediction.risk }}
      </span>
    </p>

    <p class="text-lg">
      Probabilidad estimada:
      <span class="font-semibold">
        {{ prediction.probability }}%
      </span>
    </p>

  </div>

</div>
